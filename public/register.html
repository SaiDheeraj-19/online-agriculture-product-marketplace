<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an account · AgriMart</title>
  <meta name="description" content="Join AgriMart as a customer buying produce or a farmer selling your harvest." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='12' fill='%2313261c'/><path d='M12 19V9M12 12.5c-2 0-3.5-1.5-3.5-3.5 2 0 3.5 1.5 3.5 3.5zm0 0c2 0 3.5-1.5 3.5-3.5-2 0-3.5 1.5-3.5 3.5zm0 3.5c-2 0-3.5-1.5-3.5-3.5 2 0 3.5 1.5 3.5 3.5zm0 0c2 0 3.5-1.5 3.5-3.5-2 0-3.5 1.5-3.5 3.5z' fill='none' stroke='%23d9c08c' stroke-width='1.4'/></svg>" />
  <link rel="preconnect" href="https://thumb.wikimedia.org" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-split" id="main">
    <section class="auth-visual" aria-hidden="true">
      <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Ears_of_wheat_at_dusk_%28Unsplash%29.jpg/1280px-Ears_of_wheat_at_dusk_%28Unsplash%29.jpg" alt="" />
      <div class="auth-visual-shade"></div>
      <a class="auth-visual-brand" href="index.html" tabindex="-1">AgriMart</a>
      <blockquote class="auth-visual-quote">
        <p>“One account to buy from farmers, or to sell as one.”</p>
        <cite>Wheat at dusk, Lonavala · Photo: Cezanne Ali</cite>
      </blockquote>
    </section>

    <section class="auth-panel">
      <div class="auth-panel-inner">
        <a class="auth-logo" href="index.html">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8"/><path d="M12 12c-2.5 0-4.5-2-4.5-4.5C10 7.5 12 9.5 12 12z"/><path d="M12 12c2.5 0 4.5-2 4.5-4.5C14 7.5 12 9.5 12 12z"/><path d="M12 16.5c-2.5 0-4.5-2-4.5-4.5 2.5 0 4.5 2 4.5 4.5z"/><path d="M12 16.5c2.5 0 4.5-2 4.5-4.5-2.5 0-4.5 2-4.5 4.5z"/><path d="M12 8c-1-1-1-3 0-5 1 2 1 4 0 5z"/></svg></span>
          <span>AgriMart</span>
        </a>

        <h1>Create your account</h1>
        <p class="auth-sub">Choose how you'll use AgriMart.</p>

        <form id="register-form" class="form" novalidate>
          <div class="role-toggle" role="radiogroup" aria-label="Account type">
            <label>
              <input type="radio" name="role" value="customer" checked />
              <span>I'm buying<small>Order produce from farmers</small></span>
            </label>
            <label>
              <input type="radio" name="role" value="farmer" />
              <span>I'm selling<small>List and sell my harvest</small></span>
            </label>
          </div>
          <label class="field">
            <span>Full name</span>
            <input type="text" name="name" placeholder="e.g. Ananya Sharma" maxlength="100" autocomplete="name" required />
          </label>
          <div class="form-row form-row-2">
            <label class="field">
              <span>Email</span>
              <input type="email" name="email" placeholder="you@example.com" maxlength="100" autocomplete="email" required />
            </label>
            <label class="field">
              <span>Phone <span class="field-optional">optional</span></span>
              <input type="tel" name="phone" placeholder="10-digit mobile" maxlength="15" autocomplete="tel" />
            </label>
          </div>
          <label class="field">
            <span>Password</span>
            <input type="password" name="password" placeholder="At least 6 characters" minlength="6" maxlength="72" autocomplete="new-password" required />
          </label>
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <button class="btn btn-primary btn-block btn-lg" type="submit" id="register-submit">Create account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        <p class="auth-back"><a href="index.html">← Back to home</a></p>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
